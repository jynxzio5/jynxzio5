<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b101f" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#7000ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cli-font {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
    }
    .c-prompt { fill: #00f0ff; font-weight: 700; }
    .c-host   { fill: #7000ff; font-weight: 700; }
    .c-path   { fill: #38bdf8; }
    .c-cmd    { fill: #f8fafc; font-weight: 600; }
    .c-key    { fill: #94a3b8; font-weight: 600; }
    .c-sep    { fill: #334155; }
    .c-val    { fill: #e2e8f0; }
    .c-hl     { fill: #00f0ff; }
    .c-rust   { fill: #dea584; font-weight: 700; }
    .c-cpp    { fill: #f34b7d; font-weight: 700; }
    .c-cs     { fill: #38bdf8; font-weight: 700; }
    .c-ts     { fill: #3178c6; font-weight: 700; }
    .c-green  { fill: #34d399; font-weight: 700; }
    .c-dim    { fill: #475569; }

    .term-cursor {
      fill: #00f0ff;
      animation: termBlink 1s infinite;
    }
  </style>

  <!-- Card Body -->
  <rect width="860" height="330" rx="8" fill="url(#termBg)" />
  <rect width="860" height="330" rx="8" fill="none" stroke="url(#termBorder)" stroke-width="1" />

  <!-- Window Titlebar -->
  <rect width="860" height="34" rx="8" fill="#0d111c" />
  <rect y="24" width="860" height="10" fill="#0d111c" />
  <line x1="0" y1="34" x2="860" y2="34" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="20" cy="17" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="36" cy="17" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="52" cy="17" r="5" fill="#10b981" opacity="0.8" />

  <!-- Title Center -->
  <text x="430" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600" letter-spacing="1">
    jnx@nexus-workstation: ~/workspace/opela-nexus
  </text>

  <!-- Right Meta -->
  <text x="835" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#475569" text-anchor="end">
    zsh • 80x24
  </text>

  <!-- Content Block -->
  <g transform="translate(30, 62)" class="cli-font">
    <!-- Command Execution -->
    <text x="0" y="0">
      <tspan class="c-prompt">jnx</tspan>
      <tspan class="c-dim">@</tspan>
      <tspan class="c-host">nexus</tspan>
      <tspan class="c-dim">:</tspan>
      <tspan class="c-path">~/workspace</tspan>
      <tspan fill="#64748b"> $ </tspan>
      <tspan class="c-cmd">sysinfo --target opela-nexus</tspan>
    </text>

    <!-- Output Block -->
    <g transform="translate(0, 24)">
      <!-- Line 1: User & Role -->
      <text x="0" y="0">
        <tspan class="c-key">USER</tspan>
        <tspan class="c-sep"> ............. </tspan>
        <tspan class="c-val">JNX</tspan>
        <tspan class="c-dim"> (</tspan>
        <tspan class="c-hl">github.com/jynxzio5</tspan>
        <tspan class="c-dim">)</tspan>
      </text>

      <!-- Line 2: Role -->
      <text x="0" y="22">
        <tspan class="c-key">SPECIALTY</tspan>
        <tspan class="c-sep"> ........ </tspan>
        <tspan class="c-val">Systems Architecture, Desktop Suites, Process Loaders</tspan>
      </text>

      <!-- Line 3: Active Architecture -->
      <text x="0" y="44">
        <tspan class="c-key">FLAGSHIP</tspan>
        <tspan class="c-sep"> ......... </tspan>
        <tspan class="c-val">Opela Nexus </tspan>
        <tspan class="c-dim">[</tspan>
        <tspan fill="#38bdf8">23,519 LOC</tspan>
        <tspan class="c-dim"> across </tspan>
        <tspan fill="#38bdf8">98 files</tspan>
        <tspan class="c-dim">]</tspan>
      </text>

      <!-- Line 4: Core Tech Stack -->
      <text x="0" y="66">
        <tspan class="c-key">LANGUAGES</tspan>
        <tspan class="c-sep"> ........ </tspan>
        <tspan class="c-rust">Rust</tspan>
        <tspan class="c-dim"> • </tspan>
        <tspan class="c-cpp">C++</tspan>
        <tspan class="c-dim"> • </tspan>
        <tspan class="c-cs">C#</tspan>
        <tspan class="c-dim"> • </tspan>
        <tspan class="c-ts">TypeScript</tspan>
        <tspan class="c-dim"> • </tspan>
        <tspan fill="#f59e0b">JSON</tspan>
        <tspan class="c-dim"> • </tspan>
        <tspan fill="#38bdf8">CSS</tspan>
      </text>

      <!-- Line 5: Open-Source Software -->
      <text x="0" y="88">
        <tspan class="c-key">SOFTWARE</tspan>
        <tspan class="c-sep"> ......... </tspan>
        <tspan class="c-val">Clicky, Mono-Injector, Gamble-Menu, op-loader</tspan>
      </text>

      <!-- Line 6: Web Portal -->
      <text x="0" y="110">
        <tspan class="c-key">OFFICIAL PORTAL</tspan>
        <tspan class="c-sep"> .. </tspan>
        <tspan fill="#00f0ff">https://opela.team/</tspan>
      </text>

      <!-- Line 7: Motto -->
      <text x="0" y="132">
        <tspan class="c-key">MOTTO</tspan>
        <tspan class="c-sep"> ............ </tspan>
        <tspan fill="#cbd5e1">"the winner takes it all, the loser has to fall"</tspan>
      </text>

      <!-- Line 8: Live Status -->
      <text x="0" y="154">
        <tspan class="c-key">STATUS</tspan>
        <tspan class="c-sep"> ........... </tspan>
        <tspan class="c-green">[ONLINE]</tspan>
        <tspan class="c-val"> Engineering next-generation desktop &amp; native systems</tspan>
      </text>

      <!-- Sub Command -->
      <g transform="translate(0, 192)">
        <text x="0" y="0">
          <tspan class="c-prompt">jnx</tspan>
          <tspan class="c-dim">@</tspan>
          <tspan class="c-host">nexus</tspan>
          <tspan class="c-dim">:</tspan>
          <tspan class="c-path">~/workspace</tspan>
          <tspan fill="#64748b"> $ </tspan>
          <tspan class="c-cmd">cargo build --release</tspan>
          <tspan fill="#34d399"> &amp;&amp; </tspan>
          <tspan class="c-cmd">pnpm build</tspan>
        </text>
        <rect x="362" y="-12" width="7.5" height="15" class="term-cursor" />
      </g>
    </g>
  </g>
</svg>
