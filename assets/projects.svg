<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" height="100%">
  <defs>
    <linearGradient id="pCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardBorderNorm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    .repo-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .repo-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11.5px;
      fill: #94a3b8;
      line-height: 1.45;
    }
    .repo-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      fill: #64748b;
    }
    .badge-pill {
      font-family: ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- CARD 1: Opela Nexus -->
  <g transform="translate(0, 0)">
    <rect width="418" height="106" rx="6" fill="url(#pCardBg)" stroke="#334155" stroke-width="1" />
    <!-- Repo Book Icon -->
    <path d="M 20 22 L 20 34 M 20 22 C 23 20, 28 20, 31 22 L 31 34 C 28 32, 23 32, 20 34 M 31 22 C 34 20, 39 20, 42 22 L 42 34 C 39 32, 34 32, 31 34" fill="none" stroke="#64748b" stroke-width="1.2" />
    <text x="50" y="29" class="repo-title">jynxzio5 / opela-nexus</text>
    
    <rect x="330" y="18" width="68" height="17" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="364" y="30" fill="#38bdf8" class="badge-pill" text-anchor="middle">FLAGSHIP</text>

    <text x="20" y="55" class="repo-desc">Desktop store &amp; utility suite. Multi-language architecture with</text>
    <text x="20" y="71" class="repo-desc">modular game integration and high-performance native core.</text>

    <!-- Language Info -->
    <circle cx="24" cy="91" r="4" fill="#dea584" />
    <text x="33" y="94" class="repo-meta">Rust</text>
    <circle cx="75" cy="91" r="4" fill="#3178c6" />
    <text x="84" y="94" class="repo-meta">TypeScript</text>
    <text x="180" y="94" class="repo-meta">23,519 LOC</text>
  </g>

  <!-- CARD 2: Clicky -->
  <g transform="translate(442, 0)">
    <rect width="418" height="106" rx="6" fill="url(#pCardBg)" stroke="#334155" stroke-width="1" />
    <path d="M 20 22 L 20 34 M 20 22 C 23 20, 28 20, 31 22 L 31 34 C 28 32, 23 32, 20 34 M 31 22 C 34 20, 39 20, 42 22 L 42 34 C 39 32, 34 32, 31 34" fill="none" stroke="#64748b" stroke-width="1.2" />
    <text x="50" y="29" class="repo-title">jynxzio5 / Clicky</text>

    <rect x="340" y="18" width="58" height="17" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="369" y="30" fill="#a78bfa" class="badge-pill" text-anchor="middle">UTILITY</text>

    <text x="20" y="55" class="repo-desc">High-speed auto clicker with integrated macro execution engine,</text>
    <text x="20" y="71" class="repo-desc">tailored for Arc Raiders and precision gaming automation.</text>

    <circle cx="24" cy="91" r="4" fill="#3178c6" />
    <text x="33" y="94" class="repo-meta">TypeScript</text>
    <text x="130" y="94" class="repo-meta">Desktop Automation</text>
  </g>

  <!-- CARD 3: Mono-Injector -->
  <g transform="translate(0, 122)">
    <rect width="418" height="106" rx="6" fill="url(#pCardBg)" stroke="#334155" stroke-width="1" />
    <path d="M 20 22 L 20 34 M 20 22 C 23 20, 28 20, 31 22 L 31 34 C 28 32, 23 32, 20 34 M 31 22 C 34 20, 39 20, 42 22 L 42 34 C 39 32, 34 32, 31 34" fill="none" stroke="#64748b" stroke-width="1.2" />
    <text x="50" y="29" class="repo-title">jynxzio5 / Mono-Injector</text>

    <rect x="312" y="18" width="86" height="17" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="355" y="30" fill="#34d399" class="badge-pill" text-anchor="middle">REVERSE ENG</text>

    <text x="20" y="55" class="repo-desc">Open-source assembly injector and native loader targeting Mono</text>
    <text x="20" y="71" class="repo-desc">and Unity processes via low-level process manipulation.</text>

    <circle cx="24" cy="91" r="4" fill="#178600" />
    <text x="33" y="94" class="repo-meta">C#</text>
    <text x="75" y="94" class="repo-meta">Win32 API • Mono</text>
  </g>

  <!-- CARD 4: Gamble-with-friends-Menu -->
  <g transform="translate(442, 122)">
    <rect width="418" height="106" rx="6" fill="url(#pCardBg)" stroke="#334155" stroke-width="1" />
    <path d="M 20 22 L 20 34 M 20 22 C 23 20, 28 20, 31 22 L 31 34 C 28 32, 23 32, 20 34 M 31 22 C 34 20, 39 20, 42 22 L 42 34 C 39 32, 34 32, 31 34" fill="none" stroke="#64748b" stroke-width="1.2" />
    <text x="50" y="29" class="repo-title">jynxzio5 / Gamble-with-friends-Menu</text>

    <rect x="316" y="18" width="82" height="17" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="357" y="30" fill="#f59e0b" class="badge-pill" text-anchor="middle">GAME HOOK</text>

    <text x="20" y="55" class="repo-desc">In-game dynamic GUI &amp; hooks for Gamble With Your Friends,</text>
    <text x="20" y="71" class="repo-desc">featuring memory offset mapping and realtime UI integration.</text>

    <circle cx="24" cy="91" r="4" fill="#178600" />
    <text x="33" y="94" class="repo-meta">C#</text>
    <text x="75" y="94" class="repo-meta">In-Memory Hooks</text>
  </g>
</svg>
