<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="pCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1224" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Project Borders -->
    <linearGradient id="pBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pBorder4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .p-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .p-desc {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11.5px;
      fill: #94a3b8;
      line-height: 1.5;
    }
    .p-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .dot-cyan { animation: pulseDot 2s ease-in-out infinite; transform-origin: 395px 32px; }
    .dot-purple { animation: pulseDot 2s ease-in-out 0.5s infinite; transform-origin: 825px 32px; }
    .dot-blue { animation: pulseDot 2s ease-in-out 1s infinite; transform-origin: 395px 167px; }
    .dot-green { animation: pulseDot 2s ease-in-out 1.5s infinite; transform-origin: 825px 167px; }
  </style>

  <!-- CARD 1: Opela Nexus -->
  <g transform="translate(0, 0)">
    <rect width="415" height="125" rx="12" fill="url(#pCardBg)" stroke="url(#pBorder1)" stroke-width="1.2" />
    <circle cx="395" cy="24" r="3.5" fill="#00f0ff" class="dot-cyan" />
    <!-- Title & Flagship Tag -->
    <text x="24" y="32" fill="#00f0ff" class="p-title" filter="url(#pGlow)">OPELA NEXUS</text>
    <rect x="150" y="18" width="82" height="18" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
    <text x="191" y="30.5" fill="#38bdf8" class="p-tag" text-anchor="middle">FLAGSHIP</text>
    <!-- Description -->
    <text x="24" y="58" class="p-desc">Localized desktop store &amp; utility architecture with complex</text>
    <text x="24" y="76" class="p-desc">game integrations, modular services, and high-speed UI.</text>
    <!-- Tech Stack Pill -->
    <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">
      STACK: <tspan fill="#a5b4fc">RUST</tspan> • <tspan fill="#93c5fd">TYPESCRIPT</tspan> • <tspan fill="#38bdf8">CSS/JSON</tspan>
    </text>
  </g>

  <!-- CARD 2: Clicky -->
  <g transform="translate(445, 0)">
    <rect width="415" height="125" rx="12" fill="url(#pCardBg)" stroke="url(#pBorder2)" stroke-width="1.2" />
    <circle cx="395" cy="24" r="3.5" fill="#38bdf8" class="dot-purple" />
    <!-- Title & Tag -->
    <text x="24" y="32" fill="#38bdf8" class="p-title" filter="url(#pGlow)">CLICKY</text>
    <rect x="95" y="18" width="75" height="18" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" />
    <text x="132.5" y="30.5" fill="#a78bfa" class="p-tag" text-anchor="middle">UTILITY</text>
    <!-- Description -->
    <text x="24" y="58" class="p-desc">High-performance auto clicker with built-in macro engine,</text>
    <text x="24" y="76" class="p-desc">optimized for Arc Raiders and custom gaming automation.</text>
    <!-- Tech Stack Pill -->
    <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">
      STACK: <tspan fill="#f43f5e">TYPESCRIPT</tspan> • <tspan fill="#38bdf8">DESKTOP RUNTIME</tspan>
    </text>
  </g>

  <!-- CARD 3: Mono-Injector -->
  <g transform="translate(0, 145)">
    <rect width="415" height="125" rx="12" fill="url(#pCardBg)" stroke="url(#pBorder3)" stroke-width="1.2" />
    <circle cx="395" cy="24" r="3.5" fill="#a855f7" class="dot-blue" />
    <!-- Title & Tag -->
    <text x="24" y="32" fill="#c084fc" class="p-title" filter="url(#pGlow)">MONO-INJECTOR</text>
    <rect x="160" y="18" width="85" height="18" rx="4" fill="#3b0764" stroke="#7e22ce" stroke-width="0.8" />
    <text x="202.5" y="30.5" fill="#e879f9" class="p-tag" text-anchor="middle">REVERSE ENG</text>
    <!-- Description -->
    <text x="24" y="58" class="p-desc">Open-source process injector and native loader engine for</text>
    <text x="24" y="76" class="p-desc">injecting managed Mono / Unity assemblies into target processes.</text>
    <!-- Tech Stack Pill -->
    <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">
      STACK: <tspan fill="#d8b4fe">C#</tspan> • <tspan fill="#a78bfa">WIN32 API</tspan> • <tspan fill="#c084fc">MONO RUNTIME</tspan>
    </text>
  </g>

  <!-- CARD 4: Gamble-with-friends-Menu -->
  <g transform="translate(445, 145)">
    <rect width="415" height="125" rx="12" fill="url(#pCardBg)" stroke="url(#pBorder4)" stroke-width="1.2" />
    <circle cx="395" cy="24" r="3.5" fill="#10b981" class="dot-green" />
    <!-- Title & Tag -->
    <text x="24" y="32" fill="#34d399" class="p-title" filter="url(#pGlow)">GAMBLE MENU</text>
    <rect x="145" y="18" width="80" height="18" rx="4" fill="#052e16" stroke="#15803d" stroke-width="0.8" />
    <text x="185" y="30.5" fill="#4ade80" class="p-tag" text-anchor="middle">OPEN SOURCE</text>
    <!-- Description -->
    <text x="24" y="58" class="p-desc">In-game dynamic GUI &amp; hooks for Gamble With Your Friends,</text>
    <text x="24" y="76" class="p-desc">featuring memory offsets, event interceptors, and custom UI.</text>
    <!-- Tech Stack Pill -->
    <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">
      STACK: <tspan fill="#6ee7b7">C#</tspan> • <tspan fill="#34d399">UNITY ENGINE</tspan> • <tspan fill="#a7f3d0">HOOKS</tspan>
    </text>
  </g>
</svg>
