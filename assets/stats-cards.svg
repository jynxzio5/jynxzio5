<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 110" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Language Split Gradient -->
    <linearGradient id="langBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="32%" stop-color="#f59e0b" />
      <stop offset="32.01%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="60.01%" stop-color="#3178c6" />
      <stop offset="81%" stop-color="#3178c6" />
      <stop offset="81.01%" stop-color="#dea584" />
      <stop offset="96%" stop-color="#dea584" />
      <stop offset="96.01%" stop-color="#f34b7d" />
      <stop offset="100%" stop-color="#f34b7d" />
    </linearGradient>
  </defs>

  <style>
    .t-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .t-lbl {
      font-family: ui-monospace, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #64748b;
    }
    .t-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      fill: #94a3b8;
    }
  </style>

  <!-- CARD 1: Files -->
  <g transform="translate(0, 0)">
    <rect width="200" height="110" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="24" class="t-lbl">PROJECT METRICS</text>
    <text x="20" y="58" fill="#00f0ff" class="t-val">98</text>
    <text x="20" y="80" class="t-sub">Modular Project Files</text>
    <rect x="20" y="93" width="160" height="3" rx="1.5" fill="#1e293b" />
    <rect x="20" y="93" width="135" height="3" rx="1.5" fill="#00f0ff" />
  </g>

  <!-- CARD 2: Total Lines of Code -->
  <g transform="translate(220, 0)">
    <rect width="200" height="110" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="24" class="t-lbl">CODE DENSITY</text>
    <text x="20" y="58" fill="#f8fafc" class="t-val">23,519</text>
    <text x="20" y="80" class="t-sub">Total Lines of Code</text>
    <rect x="20" y="93" width="160" height="3" rx="1.5" fill="url(#langBarGrad)" />
  </g>

  <!-- CARD 3: Language Cores -->
  <g transform="translate(440, 0)">
    <rect width="200" height="110" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="24" class="t-lbl">CORE SYSTEMS</text>
    <text x="20" y="58" fill="#38bdf8" class="t-val">4 ENGINES</text>
    <text x="20" y="80" class="t-sub">Rust • C++ • C# • TS</text>
    <rect x="20" y="93" width="160" height="3" rx="1.5" fill="#1e293b" />
    <rect x="20" y="93" width="120" height="3" rx="1.5" fill="#38bdf8" />
  </g>

  <!-- CARD 4: Discipline & Integrity -->
  <g transform="translate(660, 0)">
    <rect width="200" height="110" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="24" class="t-lbl">ARCHITECTURE</text>
    <text x="20" y="58" fill="#10b981" class="t-val">HARDENED</text>
    <text x="20" y="80" class="t-sub">Low-Level Security Core</text>
    <rect x="20" y="93" width="160" height="3" rx="1.5" fill="#1e293b" />
    <rect x="20" y="93" width="160" height="3" rx="1.5" fill="#10b981" />
  </g>
</svg>
