<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="60%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="topLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="70%" stop-color="#7000ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#7000ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#172033" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="0.8" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#7000ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes laserPan {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes waveformShift {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }

    .hud-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #64748b;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
      fill: url(#titleGrad);
    }
    .sub-title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 3px;
      fill: #94a3b8;
    }
    .tag-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .beacon-dot {
      transform-origin: 35px 35px;
      animation: pulseLive 2s ease-in-out infinite;
    }
    .laser-anim {
      animation: laserPan 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .wave-anim {
      stroke-dasharray: 8 4;
      animation: waveformShift 4s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="900" height="240" rx="10" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="10" fill="url(#techGrid)" />

  <!-- Ambient Glow Spots -->
  <circle cx="140" cy="80" r="160" fill="url(#glowLeft)" />
  <circle cx="780" cy="160" r="160" fill="url(#glowRight)" />

  <!-- Animated Top Edge Laser -->
  <line x1="0" y1="1" x2="600" y2="1" stroke="url(#topLaser)" stroke-width="2" class="laser-anim" />

  <!-- Sleek Outer Border -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="9.5" fill="none" stroke="url(#cardBorder)" stroke-width="1" />

  <!-- HUD System Telemetry Header -->
  <g transform="translate(35, 38)">
    <circle cx="0" cy="-3" r="3.5" fill="#10b981" class="beacon-dot" />
    <circle cx="0" cy="-3" r="6.5" fill="none" stroke="#10b981" stroke-width="0.7" opacity="0.6" />
    <text x="14" y="0" class="hud-text">
      <tspan fill="#34d399">ONLINE</tspan>
      <tspan fill="#334155"> // </tspan>
      <tspan>SYS_ID: OPELA-05</tspan>
      <tspan fill="#334155"> // </tspan>
      <tspan>ARCH: X86_64</tspan>
      <tspan fill="#334155"> // </tspan>
      <tspan>HOST: GITHUB/JYNXZIO5</tspan>
    </text>
  </g>

  <!-- Main Identity Content -->
  <g transform="translate(35, 108)">
    <text x="0" y="0" class="main-title">OPELA NEXUS</text>
  </g>

  <g transform="translate(35, 142)">
    <text x="0" y="0" class="sub-title">
      <tspan fill="#00f0ff">JNX</tspan>
      <tspan fill="#475569"> // </tspan>
      <tspan fill="#e2e8f0">SYSTEMS ARCHITECTURE</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#e2e8f0">LOW-LEVEL LOADERS</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#e2e8f0">DESKTOP SUITES</tspan>
    </text>
  </g>

  <!-- Technical Spec Badges -->
  <g transform="translate(35, 178)">
    <!-- Rust -->
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="14.5" fill="#dea584" class="tag-label" text-anchor="middle">RUST</text>

    <!-- C++ -->
    <rect x="68" y="0" width="55" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="95.5" y="14.5" fill="#f34b7d" class="tag-label" text-anchor="middle">C++</text>

    <!-- C# -->
    <rect x="131" y="0" width="50" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="156" y="14.5" fill="#38bdf8" class="tag-label" text-anchor="middle">C#</text>

    <!-- TypeScript -->
    <rect x="189" y="0" width="102" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="240" y="14.5" fill="#3178c6" class="tag-label" text-anchor="middle">TYPESCRIPT</text>

    <!-- Reverse Eng -->
    <rect x="299" y="0" width="155" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="376.5" y="14.5" fill="#c084fc" class="tag-label" text-anchor="middle">REVERSE ENGINEERING</text>
  </g>

  <!-- Right Side: Clean Precision Oscilloscope Waveform Graphic -->
  <g transform="translate(620, 60)" opacity="0.8">
    <rect x="0" y="0" width="245" height="135" rx="6" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <!-- Grid inside display -->
    <line x1="0" y1="34" x2="245" y2="34" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="0" y1="68" x2="245" y2="68" stroke="#1e293b" stroke-width="0.8" />
    <line x1="0" y1="102" x2="245" y2="102" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="61" y1="0" x2="61" y2="135" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="122" y1="0" x2="122" y2="135" stroke="#1e293b" stroke-width="0.8" />
    <line x1="183" y1="0" x2="183" y2="135" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2 2" />

    <!-- Wave lines -->
    <path d="M 0 68 Q 30 18, 60 68 T 120 68 T 180 68 T 245 68" fill="none" stroke="#00f0ff" stroke-width="1.8" class="wave-anim" />
    <path d="M 0 68 Q 35 110, 70 68 T 140 68 T 210 68 T 245 68" fill="none" stroke="#7000ff" stroke-width="1.2" opacity="0.6" />

    <!-- Display Labels -->
    <text x="10" y="18" font-family="ui-monospace, monospace" font-size="8.5" fill="#00f0ff" font-weight="700">CORE FREQUENCY: OPTIMAL</text>
    <text x="235" y="18" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" text-anchor="end">REALTIME</text>
    <text x="10" y="125" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b">CH_01: ASYNC_IO</text>
    <text x="235" y="125" font-family="ui-monospace, monospace" font-size="8.5" fill="#10b981" text-anchor="end">0.00% LOSS</text>
  </g>
</svg>
