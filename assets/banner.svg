<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0b1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Nebula Glow Gradients -->
    <radialGradient id="nebulaCyan" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#8b5cf6;#3b82f6;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#00f0ff;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#00f0ff;#8b5cf6;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes laserSweep {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes laserSweepRev {
      0% { transform: translateX(900px); }
      100% { transform: translateX(-900px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(6px); opacity: 0.9; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-280px); }
      100% { transform: translateY(280px); }
    }

    .base-bg { fill: url(#bgGradient); }
    .grid-layer { fill: url(#grid); }
    .title-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#textGrad);
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #00f0ff;
    }
    .sub-text {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2.5px;
      fill: #94a3b8;
    }
    .status-text {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #34d399;
    }
    .quote-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 1.5px;
      fill: #64748b;
    }
    .laser-line {
      animation: laserSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .laser-line-rev {
      animation: laserSweepRev 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .status-dot {
      animation: blink 1.6s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out 1.5s infinite; }
    .particle-3 { animation: floatParticle 6s ease-in-out 3s infinite; }
    .particle-4 { animation: floatParticle 8s ease-in-out 0.8s infinite; }
    .ring-rot {
      transform-origin: 790px 140px;
      animation: rotateRing 20s linear infinite;
    }
    .ring-rot-rev {
      transform-origin: 790px 140px;
      animation: rotateRing 14s linear infinite reverse;
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect width="900" height="280" rx="16" fill="url(#bgGradient)" />
  <rect width="900" height="280" rx="16" fill="url(#grid)" />

  <!-- Glowing Nebulas -->
  <circle cx="160" cy="100" r="180" fill="url(#nebulaCyan)" />
  <circle cx="760" cy="180" r="190" fill="url(#nebulaPurple)" />
  <circle cx="450" cy="240" r="140" fill="url(#nebulaBlue)" />

  <!-- Animated Particles -->
  <g>
    <circle cx="120" cy="60" r="1.5" fill="#00f0ff" class="particle-1" />
    <circle cx="280" cy="190" r="2" fill="#8b5cf6" class="particle-2" />
    <circle cx="420" cy="45" r="1.5" fill="#38bdf8" class="particle-3" />
    <circle cx="670" cy="80" r="2" fill="#a78bfa" class="particle-4" />
    <circle cx="730" cy="230" r="1.5" fill="#00f0ff" class="particle-1" />
    <circle cx="220" cy="230" r="1" fill="#38bdf8" class="particle-3" />
  </g>

  <!-- Cyber Tech Hexagon & Gyro Widget (Right Side) -->
  <g class="ring-rot" opacity="0.4">
    <circle cx="790" cy="140" r="60" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="8 6 2 6" />
    <circle cx="790" cy="140" r="45" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="14 10" />
  </g>
  <g class="ring-rot-rev" opacity="0.3">
    <polygon points="790,95 829,117 829,163 790,185 751,163 751,117" fill="none" stroke="#38bdf8" stroke-width="1.2" />
  </g>
  <circle cx="790" cy="140" r="6" fill="#00f0ff" filter="url(#softGlow)" opacity="0.8" />

  <!-- Left Accent Tech Bracket -->
  <g opacity="0.6">
    <path d="M 36 60 L 26 60 L 26 120" fill="none" stroke="#00f0ff" stroke-width="2" />
    <path d="M 26 160 L 26 220 L 36 220" fill="none" stroke="#8b5cf6" stroke-width="2" />
    <line x1="26" y1="135" x2="26" y2="145" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Top Laser Pulse -->
  <g clip-path="url(#borderClip)">
    <line x1="0" y1="1" x2="450" y2="1" stroke="url(#laserGrad)" stroke-width="2.5" class="laser-line" />
    <line x1="450" y1="279" x2="900" y2="279" stroke="url(#laserGrad)" stroke-width="2" class="laser-line-rev" />
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Content Section -->
  <g transform="translate(60, 0)">
    <!-- Top Cyber Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="270" height="26" rx="13" fill="#030712" stroke="#1e293b" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#00f0ff" filter="url(#softGlow)" class="status-dot" />
      <text x="28" y="17" class="badge-text">SYSTEM ARCHITECT // VIBECODER</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 118)">
      <text x="0" y="0" class="title-text" filter="url(#softGlow)">OPELA NEXUS</text>
    </g>

    <!-- Dynamic Subtitle -->
    <g transform="translate(0, 154)">
      <text x="0" y="0" class="sub-text">
        <tspan fill="#38bdf8">JNX</tspan>
        <tspan fill="#475569"> /// </tspan>
        <tspan fill="#cbd5e1">REVERSE ENGINEERING</tspan>
        <tspan fill="#00f0ff"> • </tspan>
        <tspan fill="#cbd5e1">DESKTOP TOOLS</tspan>
        <tspan fill="#00f0ff"> • </tspan>
        <tspan fill="#cbd5e1">SYSTEMS</tspan>
      </text>
    </g>

    <!-- Signature Quote -->
    <g transform="translate(0, 188)">
      <text x="0" y="0" class="quote-text">"the winner takes it all, the loser has to fall"</text>
    </g>

    <!-- Bottom Status Indicators -->
    <g transform="translate(0, 230)">
      <!-- Operational Pill -->
      <rect x="0" y="0" width="180" height="22" rx="6" fill="#052e16" stroke="#15803d" stroke-width="0.8" opacity="0.8" />
      <circle cx="11" cy="11" r="3.5" fill="#22c55e" class="status-dot" />
      <text x="22" y="14.5" class="status-text">SYSTEMS ACTIVE</text>

      <!-- Stack Tags -->
      <g transform="translate(192, 0)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" />
        <text x="30" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">RUST</text>
      </g>
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="55" height="22" rx="6" fill="#082f49" stroke="#0369a1" stroke-width="0.8" />
        <text x="27.5" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#7dd3fc" text-anchor="middle">C++</text>
      </g>
      <g transform="translate(323, 0)">
        <rect x="0" y="0" width="50" height="22" rx="6" fill="#3b0764" stroke="#7e22ce" stroke-width="0.8" />
        <text x="25" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#d8b4fe" text-anchor="middle">C#</text>
      </g>
      <g transform="translate(381, 0)">
        <rect x="0" y="0" width="105" height="22" rx="6" fill="#172554" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="52.5" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">TYPESCRIPT</text>
      </g>
    </g>
  </g>

  <!-- Corner Tech Accent Decals -->
  <g opacity="0.7">
    <path d="M 870 14 L 886 14 L 886 30" fill="none" stroke="#00f0ff" stroke-width="2" />
    <circle cx="886" cy="14" r="2" fill="#00f0ff" />
    <path d="M 14 266 L 30 266" fill="none" stroke="#8b5cf6" stroke-width="2" />
  </g>
</svg>
