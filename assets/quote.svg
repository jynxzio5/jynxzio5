<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 70" width="100%" height="70">
  <defs>
    <linearGradient id="qBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    .q-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      font-style: italic;
      letter-spacing: 2px;
      fill: #e2e8f0;
    }
    .q-author {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #64748b;
    }
  </style>

  <rect width="860" height="70" rx="6" fill="#070a12" stroke="url(#qBorder)" stroke-width="1" />

  <text x="430" y="32" text-anchor="middle" class="q-text">
    "the winner takes it all , the loser has to fall"
  </text>
  <text x="430" y="52" text-anchor="middle" class="q-author">
