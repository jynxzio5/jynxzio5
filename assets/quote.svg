<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#110d24" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="quoteBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="quoteTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes quotePulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.05); }
    }
    @keyframes quoteGlowShift {
      0%, 100% { fill: #8b5cf6; }
      50% { fill: #00f0ff; }
    }
    .quote-mark {
      font-family: 'Georgia', serif;
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      animation: quoteGlowShift 6s ease-in-out infinite;
    }
    .quote-content {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 19px;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 2px;
      fill: url(#quoteTextGrad);
    }
    .quote-author {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #a78bfa;
    }
  </style>

  <!-- Card Frame -->
  <rect width="860" height="120" rx="14" fill="url(#quoteBg)" stroke="url(#quoteBorder)" stroke-width="1.2" />

  <!-- Stylized Decorative Quote Marks -->
  <text x="36" y="75" class="quote-mark" opacity="0.25">“</text>
  <text x="800" y="105" class="quote-mark" opacity="0.2" text-anchor="end">”</text>

  <!-- Central Quote Text -->
  <g transform="translate(430, 52)">
    <text x="0" y="0" text-anchor="middle" class="quote-content" filter="url(#qGlow)">
      “ the winner takes it all , the loser has to fall ”
    </text>
  </g>

  <!-- Author / Signature Line -->
  <g transform="translate(430, 88)">
    <line x1="-140" y1="-4" x2="-80" y2="-4" stroke="#475569" stroke-width="1" />
    <text x="0" y="0" text-anchor="middle" class="quote-author">
      JNX // OPELA NEXUS
    </text>
    <line x1="80" y1="-4" x2="140" y2="-4" stroke="#475569" stroke-width="1" />
  </g>

  <!-- Tech Dots -->
  <circle cx="20" cy="20" r="2" fill="#00f0ff" opacity="0.6" />
  <circle cx="840" cy="20" r="2" fill="#8b5cf6" opacity="0.6" />
  <circle cx="20" cy="100" r="2" fill="#8b5cf6" opacity="0.6" />
  <circle cx="840" cy="100" r="2" fill="#00f0ff" opacity="0.6" />
</svg>
