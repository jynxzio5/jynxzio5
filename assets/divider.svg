<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <!-- Center Pulse Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Moving Laser Pulse Gradient -->
    <linearGradient id="laserPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweep {
      0% { transform: translateX(-450px); }
      100% { transform: translateX(450px); }
    }
    @keyframes pulseDiamond {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #00f0ff); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .laser-comet {
      animation: sweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .center-node {
      transform-origin: 450px 12px;
      animation: pulseDiamond 2s ease-in-out infinite;
    }
    .pulse-ring {
      transform-origin: 450px 12px;
      animation: pulseRing 2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
  </style>

  <!-- Ambient Background Glow Line -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#lineGrad)" stroke-width="2" filter="url(#laserGlow)" opacity="0.6" />

  <!-- Core Sharp Center Line -->
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#lineGrad)" stroke-width="1" />

  <!-- Moving Laser Comet -->
  <g class="laser-comet">
    <line x1="300" y1="12" x2="600" y2="12" stroke="url(#laserPulse)" stroke-width="2.5" filter="url(#laserGlow)" />
  </g>

  <!-- Pulsing Center Energy Ring -->
  <circle cx="450" cy="12" r="5" fill="none" stroke="#00f0ff" stroke-width="1" class="pulse-ring" />

  <!-- Central Diamond Accent -->
  <g class="center-node">
    <polygon points="450,7 455,12 450,17 445,12" fill="#00f0ff" />
    <circle cx="450" cy="12" r="1.5" fill="#ffffff" />
  </g>

  <!-- Side Tech Dots -->
  <circle cx="420" cy="12" r="1.5" fill="#00f0ff" opacity="0.5" />
  <circle cx="400" cy="12" r="1" fill="#00f0ff" opacity="0.3" />
  <circle cx="480" cy="12" r="1.5" fill="#8b5cf6" opacity="0.5" />
  <circle cx="500" cy="12" r="1" fill="#8b5cf6" opacity="0.3" />
</svg>
