<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="100%" height="16">
  <defs>
    <!-- Base Divider Gradient -->
    <linearGradient id="divBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0" />
      <stop offset="20%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#334155" stop-opacity="1" />
      <stop offset="80%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- Moving Laser Sweep Gradient -->
    <linearGradient id="laserSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes sweepLine {
      0% { transform: translateX(-450px); }
      100% { transform: translateX(450px); }
    }
    @keyframes pulseCenter {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .laser-track {
      animation: sweepLine 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .center-cross {
      animation: pulseCenter 2s ease-in-out infinite;
    }
  </style>

  <!-- 1px Base Track -->
  <line x1="40" y1="8" x2="860" y2="8" stroke="url(#divBase)" stroke-width="1" />

  <!-- Moving Laser Accent -->
  <g class="laser-track">
    <line x1="250" y1="8" x2="650" y2="8" stroke="url(#laserSweep)" stroke-width="1.5" />
  </g>

  <!-- Center Minimalist Crosshair -->
  <g class="center-cross" opacity="0.8">
    <circle cx="450" cy="8" r="2.5" fill="#00f0ff" />
    <line x1="450" y1="3" x2="450" y2="13" stroke="#00f0ff" stroke-width="0.8" opacity="0.6" />
    <line x1="445" y1="8" x2="455" y2="8" stroke="#00f0ff" stroke-width="0.8" opacity="0.6" />
  </g>
</svg>
